<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Clínico IES</title>
  
  <!-- Carregando Tailwind CSS para estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configurações específicas do Tailwind para Impressão -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'print': {'raw': 'print'},
          }
        }
      }
    }
  </script>
  
  <!-- Carregando React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Carregando Babel para compilar o JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Carregando Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <style>
    /* Estilos base */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    /* Estilo para a barra de rolagem */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Ajustes forçados para impressão perfeita */
    @media print {
      @page { margin: 1.5cm; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: white !important; }
      .print-break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
      /* Remove sombras na impressão para ficar mais limpo */
      .shadow-sm, .shadow-md, .shadow-xl { box-shadow: none !important; border-color: #e2e8f0 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 print:bg-white">
  <div id="root" class="h-screen w-screen print:h-auto print:w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // As SUAS chaves reais do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB3ZmY47c9BPcnCIbTiF9quhYO5aJmBFqo",
      authDomain: "instituto-elo-de-saude.firebaseapp.com",
      projectId: "instituto-elo-de-saude",
      storageBucket: "instituto-elo-de-saude.firebasestorage.app",
      messagingSenderId: "521221777368",
      appId: "1:521221777368:web:6be6959dc9c636a0b474ad",
      measurementId: "G-LVPJHKK2RP"
    };

    // Inicializando Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = 'painel-clinico-ies-web';

    // Ícones
    const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>;
    const IconFile = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>;
    const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>;
    const IconActivity = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" /></svg>;
    const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
    const IconCloud = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" /></svg>;
    const IconPrinter = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M6.72 13.829c-.24.03-.48.062-.724.092m6.524-4.31a1.5 1.5 0 01-1.38-.9m-1.425 2.1c-.24.03-.48.062-.724.092m-5.8 4.053c-.24.03-.48.062-.724.092M6.72 13.829l-1.077 4.31a1.5 1.5 0 001.455 1.861h11.75c.875 0 1.575-.75 1.455-1.861l-1.077-4.31m-12.524-3.153A2.25 2.25 0 014.5 9h15a2.25 2.25 0 012.25 2.25v2.25A2.25 2.25 0 0119.5 15.75h-15a2.25 2.25 0 01-2.25-2.25v-2.25z" /><path strokeLinecap="round" strokeLinejoin="round" d="M8.25 10.5V6a2.25 2.25 0 012.25-2.25h3A2.25 2.25 0 0115.75 6v4.5" /></svg>;

    const checkMetricStatus = (value, min, max) => {
      if (value === null || value === undefined) return 'neutral';
      if (min !== undefined && value < min) return 'altered';
      if (max !== undefined && value > max) return 'altered';
      return 'normal';
    };

    const SimpleLineChart = ({ data, metricName, unit }) => {
      if (!data || data.length === 0) return null;

      const width = 400;
      const height = 150;
      const paddingX = 40;
      const paddingY = 30;

      const values = data.map(d => d.value);
      const refLows = data.map(d => d.refLow).filter(v => v !== undefined);
      const refHighs = data.map(d => d.refHigh).filter(v => v !== undefined);
      
      const minValRaw = Math.min(...values, ...(refLows.length ? refLows : []));
      const maxValRaw = Math.max(...values, ...(refHighs.length ? refHighs : []));
      
      const range = maxValRaw - minValRaw || 1;
      const minVal = minValRaw - (range * 0.1);
      const maxVal = maxValRaw + (range * 0.1);
      const actualRange = maxVal - minVal;

      const getY = (val) => height - paddingY - ((val - minVal) / actualRange) * (height - 2 * paddingY);
      const getX = (index) => paddingX + (index * (width - 2 * paddingX)) / Math.max(1, data.length - 1);

      const points = data.map((d, i) => `${getX(i)},${getY(d.value)}`).join(' ');
      const latestRefLow = refLows[refLows.length - 1];
      const latestRefHigh = refHighs[refHighs.length - 1];

      const hasRefRange = latestRefLow !== undefined && latestRefHigh !== undefined;
      const refLowY = hasRefRange ? getY(latestRefLow) : null;
      const refHighY = hasRefRange ? getY(latestRefHigh) : null;

      return (
        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 print-break-inside-avoid">
          <div className="mb-2 flex justify-between items-center">
            <h4 className="font-semibold text-slate-700">{metricName}</h4>
            <span className="text-xs text-slate-500">{unit}</span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
            {[minValRaw, maxValRaw].map((val, i) => (
              <g key={i}>
                <line x1={paddingX} y1={getY(val)} x2={width - paddingX} y2={getY(val)} stroke="#e2e8f0" strokeDasharray="4" />
                <text x={paddingX - 5} y={getY(val) + 4} fontSize="10" fill="#94a3b8" textAnchor="end">{val.toFixed(1)}</text>
              </g>
            ))}

            {hasRefRange && (
              <rect x={paddingX} y={refHighY} width={width - 2 * paddingX} height={refLowY - refHighY} fill="#0040F9" opacity="0.05" />
            )}

            <polyline points={points} fill="none" stroke="#0040F9" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
            
            {data.map((d, i) => {
              const isAltered = checkMetricStatus(d.value, d.refLow, d.refHigh) === 'altered';
              return (
                <g key={i}>
                  <circle cx={getX(i)} cy={getY(d.value)} r="4" fill={isAltered ? "#B4650A" : "#0040F9"} stroke="#ffffff" strokeWidth="1.5" />
                  <text x={getX(i)} y={height - 10} fontSize="10" fill="#64748b" textAnchor="middle">
                    {new Date(d.date).toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' })}
                  </text>
                  <text x={getX(i)} y={getY(d.value) - 10} fontSize="10" fill={isAltered ? "#B4650A" : "#1e293b"} fontWeight="bold" textAnchor="middle">
                    {d.value}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    function PainelClinico() {
      const [patients, setPatients] = useState([]);
      const [selectedPatientId, setSelectedPatientId] = useState(null);
      const [activeTab, setActiveTab] = useState('painel');
      const [selectedSnapshotIdx, setSelectedSnapshotIdx] = useState(0);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState('patient');
      const [jsonInput, setJsonInput] = useState('');
      const [jsonError, setJsonError] = useState('');
      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [authError, setAuthError] = useState(null);

      useEffect(() => {
        const initAuth = async () => {
          try {
            await auth.signInAnonymously();
            setAuthError(null);
          } catch (error) {
            console.error("Erro no login:", error);
            setAuthError("Ative o login Anônimo no Firebase: " + error.message);
          }
        };
        initAuth();
        const unsubscribe = auth.onAuthStateChanged(setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setIsSyncing(true);
        const patientsRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('patients');
        const unsubscribe = patientsRef.onSnapshot((snapshot) => {
          const loadedPatients = [];
          snapshot.forEach((doc) => { loadedPatients.push(doc.data()); });
          setPatients(loadedPatients);
          setIsSyncing(false);
        }, (err) => {
          console.error("Erro ao carregar dados da nuvem:", err);
          setIsSyncing(false);
        });
        return () => unsubscribe();
      }, [user]);

      useEffect(() => {
        if (patients.length > 0 && !selectedPatientId) {
          setSelectedPatientId(patients[0].patientId);
          setSelectedSnapshotIdx(patients[0].snapshots?.length ? patients[0].snapshots.length - 1 : 0);
        }
      }, [patients, selectedPatientId]);

      const saveToCloud = async (patientData) => {
        if (!user) return;
        setIsSyncing(true);
        try {
          const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('patients').doc(patientData.patientId);
          await docRef.set(patientData);
        } catch (error) {
          console.error("Erro ao salvar:", error);
        } finally {
          setIsSyncing(false);
        }
      };

      const handlePrint = () => {
        window.print();
      };

      const handleImportJson = async () => {
        try {
          setJsonError('');
          const parsedData = JSON.parse(jsonInput);

          if (modalType === 'patient') {
            if (!parsedData.patientId || !parsedData.name || !Array.isArray(parsedData.snapshots)) throw new Error("JSON inválido para Paciente.");
            await saveToCloud(parsedData);
            setSelectedPatientId(parsedData.patientId);
            setSelectedSnapshotIdx(parsedData.snapshots.length - 1);
          } else if (modalType === 'snapshot') {
            if (!parsedData.date || !Array.isArray(parsedData.metrics)) throw new Error("JSON inválido para Snapshot.");
            const currentPatientData = patients.find(p => p.patientId === selectedPatientId);
            if (!currentPatientData) throw new Error("Nenhum paciente selecionado.");
            const updatedPatient = {
              ...currentPatientData,
              snapshots: [...currentPatientData.snapshots, parsedData].sort((a, b) => new Date(a.date) - new Date(b.date))
            };
            await saveToCloud(updatedPatient);
            setSelectedSnapshotIdx(updatedPatient.snapshots.length - 1);
          }
          setIsModalOpen(false);
          setJsonInput('');
        } catch (err) {
          setJsonError(err.message);
        }
      };

      const currentPatient = patients.find(p => p.patientId === selectedPatientId);
      const currentSnapshot = currentPatient?.snapshots[selectedSnapshotIdx] || currentPatient?.snapshots[currentPatient.snapshots.length - 1];

      const trendData = useMemo(() => {
        if (!currentPatient) return [];
        const metricsMap = {};
        currentPatient.snapshots.forEach(snap => {
          snap.metrics?.forEach(m => {
            if (!metricsMap[m.key]) metricsMap[m.key] = { label: m.label, unit: m.unit, data: [] };
            metricsMap[m.key].data.push({ date: snap.date, value: m.value, refLow: m.refLow, refHigh: m.refHigh });
          });
        });
        return Object.values(metricsMap).filter(m => m.data.length > 0);
      }, [currentPatient]);

      return (
        <div className="flex h-screen overflow-hidden print:h-auto print:overflow-visible">
          
          {/* Sidebar - Escondida na Impressão */}
          <div className="w-72 bg-[#00113F] text-white flex flex-col shadow-xl z-10 flex-shrink-0 print:hidden">
            <div className="p-6 border-b border-white/10">
              <div className="flex justify-between items-start">
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  <IconActivity /> Painel IES
                </h1>
                {user && (
                  <div className="flex items-center gap-1 text-[10px] bg-white/10 px-2 py-1 rounded-full text-blue-200" title="Sincronização em Nuvem">
                    <div className={`${isSyncing ? 'animate-pulse' : ''}`}><IconCloud /></div>
                    {isSyncing ? 'Sincronizando' : 'Online'}
                  </div>
                )}
              </div>
              {authError && <div className="mt-3 p-2 bg-red-500/20 border border-red-500/50 rounded-lg text-[11px] text-red-100"><span className="font-bold">⚠️ Erro:</span> {authError}</div>}
              <p className="text-xs text-blue-200 mt-2 opacity-80">Endocrinologia & Nutrologia</p>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-2">
              <div className="text-xs font-semibold text-blue-300 uppercase tracking-wider mb-3 px-2">Pacientes</div>
              {patients.map(p => (
                <button key={p.patientId} onClick={() => { setSelectedPatientId(p.patientId); setSelectedSnapshotIdx(p.snapshots.length - 1); }} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors text-left ${selectedPatientId === p.patientId ? 'bg-[#0040F9] text-white font-medium shadow-md' : 'text-slate-300 hover:bg-white/10 hover:text-white'}`}>
                  <IconUser />
                  <div className="truncate">
                    <div className="truncate">{p.name}</div>
                    <div className="text-[10px] opacity-70 truncate">{p.prontuario || 'Sem prontuário'}</div>
                  </div>
                </button>
              ))}
            </div>

            <div className="p-4 border-t border-white/10 space-y-3">
              <button onClick={() => { setModalType('patient'); setJsonInput(''); setJsonError(''); setIsModalOpen(true); }} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-[#0040F9] hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-colors">
                <IconPlus /> Novo Paciente
              </button>
            </div>
          </div>

          {/* Área Principal */}
          <div className="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 print:bg-white print:h-auto print:overflow-visible print:block">
            {currentPatient ? (
              <>
                {/* Cabeçalho da Impressão (Só aparece no papel) */}
                <div className="hidden print:block text-center mb-6 pb-4 border-b-2 border-slate-200">
                  <h1 className="text-2xl font-bold text-slate-800 flex items-center justify-center gap-2">
                    <IconActivity /> Instituto Elo de Saúde
                  </h1>
                  <p className="text-slate-500 mt-1">Relatório Clínico e Análise Laboratorial</p>
                </div>

                {/* Cabeçalho do Paciente */}
                <header className="bg-white px-8 py-6 border-b border-slate-200 flex justify-between items-start flex-shrink-0 print:border-none print:p-0 print:mb-6">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-800">{currentPatient.name}</h2>
                    <div className="flex items-center gap-4 mt-2 text-sm text-slate-500">
                      {currentPatient.prontuario && <span>Prontuário: <strong className="text-slate-700">{currentPatient.prontuario}</strong></span>}
                      <span>{currentPatient.info}</span>
                    </div>
                  </div>
                  
                  {/* Botões do Topo - Escondidos na Impressão */}
                  <div className="flex items-center gap-3 print:hidden">
                    <button onClick={handlePrint} className="flex items-center gap-2 px-4 py-2 bg-slate-800 text-white hover:bg-slate-700 rounded-lg text-sm font-medium transition-colors shadow-sm">
                      <IconPrinter /> Imprimir Relatório
                    </button>
                    <div className="flex items-center bg-slate-100 p-1 rounded-lg">
                      <button onClick={() => setActiveTab('painel')} className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'painel' ? 'bg-white shadow text-[#0040F9]' : 'text-slate-500 hover:text-slate-700'}`}>Painel</button>
                      <button onClick={() => setActiveTab('historico')} className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'historico' ? 'bg-white shadow text-[#0040F9]' : 'text-slate-500 hover:text-slate-700'}`}>Gráficos</button>
                    </div>
                  </div>
                </header>

                <div className="flex-1 overflow-y-auto p-8 print:p-0 print:overflow-visible">
                  
                  {activeTab === 'painel' && currentSnapshot && (
                    <div className="space-y-8 max-w-6xl mx-auto pb-10 print:pb-0">
                      
                      {/* Seletor de Snapshot - Parcialmente escondido na impressão */}
                      <div className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex-wrap gap-4 print:border-none print:shadow-none print:p-0 print:mb-2">
                        <div className="flex gap-2 flex-wrap">
                          <h3 className="font-bold text-lg text-slate-800 hidden print:block border-l-4 border-[#0040F9] pl-3">
                            Coleta de Referência: {currentSnapshot.label || new Date(currentSnapshot.date).toLocaleDateString('pt-BR')}
                          </h3>
                          <div className="print:hidden flex gap-2">
                            {currentPatient.snapshots.map((snap, idx) => (
                              <button key={idx} onClick={() => setSelectedSnapshotIdx(idx)} className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${selectedSnapshotIdx === idx ? 'bg-[#0040F9] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                {snap.label || new Date(snap.date).toLocaleDateString('pt-BR')}
                              </button>
                            ))}
                          </div>
                        </div>
                        <button onClick={() => { setModalType('snapshot'); setJsonInput(''); setJsonError(''); setIsModalOpen(true); }} className="flex items-center gap-2 px-4 py-2 bg-blue-50 text-[#0040F9] hover:bg-blue-100 rounded-lg text-sm font-medium transition-colors print:hidden">
                          <IconPlus /> Adicionar Exame
                        </button>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 print:grid-cols-4">
                        {currentSnapshot.metrics?.map((m, idx) => {
                          const isAltered = checkMetricStatus(m.value, m.refLow, m.refHigh) === 'altered';
                          return (
                            <div key={idx} className={`p-4 rounded-xl border flex flex-col justify-between print-break-inside-avoid ${isAltered ? 'bg-[#B4650A]/5 border-[#B4650A]/30 print:bg-white print:border-[#B4650A]' : 'bg-white border-slate-200 shadow-sm print:shadow-none'}`}>
                              <div className="flex justify-between items-start mb-2">
                                <span className="text-sm font-medium text-slate-600 print:text-slate-800">{m.label}</span>
                                {isAltered && <div className="text-[#B4650A]"><IconAlert /></div>}
                              </div>
                              <div className="flex items-baseline gap-1 mt-1">
                                <span className={`text-2xl font-bold ${isAltered ? 'text-[#B4650A]' : 'text-slate-800'}`}>{m.value}</span>
                                <span className="text-xs text-slate-500 font-medium">{m.unit}</span>
                              </div>
                              <div className="text-[10px] text-slate-400 mt-2 print:text-slate-500">Ref: {m.refLow ?? '-'} ~ {m.refHigh ?? '-'}</div>
                            </div>
                          )
                        })}
                      </div>

                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 print:grid-cols-1 print:gap-4">
                        <div className="lg:col-span-2 space-y-6">
                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden print:shadow-none">
                            <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 print:bg-white print:border-b-2 print:border-slate-800">
                              <h3 className="font-semibold text-slate-800 flex items-center gap-2"><IconFile /> Achados e Interpretação Clínica</h3>
                            </div>
                            <div className="divide-y divide-slate-100 print:divide-slate-300">
                              {currentSnapshot.findings?.map((f, idx) => (
                                <div key={idx} className="p-6 print:p-4 print-break-inside-avoid">
                                  <span className="inline-block px-2.5 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-md mb-3 print:bg-transparent print:p-0 print:text-sm print:uppercase">{f.group}</span>
                                  <div className="space-y-3 text-sm">
                                    <div><strong className="text-slate-700">Achado:</strong> <span className="text-slate-600">{f.achado}</span></div>
                                    <div><strong className="text-slate-700">Hipótese:</strong> <span className="text-slate-600">{f.hipotese}</span></div>
                                    <div className="bg-blue-50 p-3 rounded-lg mt-2 text-[#0040F9] print:bg-white print:border print:border-slate-300 print:text-slate-800"><strong className="block text-xs uppercase mb-1">Sugestão de Conduta</strong>{f.sugestao}</div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="space-y-6 print:space-y-4 print:grid print:grid-cols-2 print:gap-4">
                          <div className="bg-[#00113F] text-white rounded-xl p-6 shadow-md print:bg-white print:border print:border-slate-300 print:text-slate-900 print:shadow-none print-break-inside-avoid">
                            <h3 className="font-semibold mb-4 text-blue-200 border-b border-white/20 pb-2 print:text-slate-800 print:border-slate-300">Síntese do Caso</h3>
                            <ul className="list-disc pl-4 space-y-2 text-sm text-slate-100 print:text-slate-700">{currentSnapshot.sintese?.map((s, i) => <li key={i}>{s}</li>)}</ul>
                          </div>
                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 print:shadow-none print-break-inside-avoid">
                            <h3 className="font-semibold text-slate-800 mb-3 border-b border-slate-100 pb-2 print:border-slate-300">Resumo Prontuário</h3>
                            <p className="text-sm text-slate-600 leading-relaxed print:text-slate-700">{currentSnapshot.prontuario}</p>
                          </div>
                          <div className="bg-amber-50 rounded-xl border border-amber-100 shadow-sm p-6 print:bg-white print:shadow-none print-break-inside-avoid print:col-span-2">
                            <h3 className="font-semibold text-[#B4650A] mb-3 border-b border-amber-200 pb-2 print:text-slate-800 print:border-slate-300">Terapêutica</h3>
                            <div className="space-y-4 flex flex-col md:flex-row md:space-y-0 md:gap-8">
                              {currentSnapshot.terapeutica?.manipuladas?.length > 0 && (
                                <div className="flex-1">
                                  <strong className="text-xs uppercase text-slate-500">Fórmulas Manipuladas</strong>
                                  <ul className="list-disc pl-4 mt-1 text-sm text-slate-700">
                                    {currentSnapshot.terapeutica.manipuladas.map((item, i) => <li key={i}>{item}</li>)}
                                  </ul>
                                </div>
                              )}
                              {currentSnapshot.terapeutica?.comercializadas?.length > 0 && (
                                <div className="flex-1">
                                  <strong className="text-xs uppercase text-slate-500">Fármacos Comerciais</strong>
                                  <ul className="list-disc pl-4 mt-1 text-sm text-slate-700">
                                    {currentSnapshot.terapeutica.comercializadas.map((item, i) => <li key={i}>{item}</li>)}
                                  </ul>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'historico' && (
                    <div className="max-w-6xl mx-auto space-y-6 pb-10 print:pb-0">
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 print:border-none print:p-0 print:shadow-none">
                        <h3 className="text-lg font-bold text-slate-800 mb-2 border-l-4 border-[#0040F9] pl-3">Painel de Tendências (Gráficos)</h3>
                        <p className="text-sm text-slate-500 mb-6 print:hidden">Acompanhamento longitudinal de marcadores. A faixa azul indica o limite de referência.</p>
                        {trendData.length > 0 ? (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 print:grid-cols-2">
                            {trendData.map((metric, idx) => <SimpleLineChart key={idx} data={metric.data} metricName={metric.label} unit={metric.unit} />)}
                          </div>
                        ) : (
                          <div className="text-center py-12 text-slate-400">Poucos dados para gerar gráficos históricos.</div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </>
            ) : (
              <div className="flex-1 flex items-center justify-center bg-slate-50 p-8 text-center print:hidden">
                <div className="max-w-md">
                  <div className="w-16 h-16 bg-blue-100 text-[#0040F9] rounded-full flex items-center justify-center mx-auto mb-4"><IconActivity /></div>
                  <h2 className="text-xl font-bold text-slate-700 mb-2">Nenhum paciente selecionado</h2>
                  <p className="text-slate-500 mb-6 text-sm">Selecione um paciente na lista lateral para visualizar ou imprimir seu relatório.</p>
                </div>
              </div>
            )}
          </div>

          {/* Modal - Escondido na impressão */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 print:hidden">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-[#00113F] text-white">
                  <h3 className="text-lg font-bold">{modalType === 'patient' ? 'Importar Novo Paciente' : 'Importar Exame'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-white/60 hover:text-white text-xl font-bold">&times;</button>
                </div>
                <div className="p-6 flex-1 overflow-y-auto">
                  <p className="text-sm text-slate-600 mb-4">Cole abaixo o código JSON gerado pela inteligência artificial.</p>
                  <textarea value={jsonInput} onChange={(e) => setJsonInput(e.target.value)} className="w-full h-64 p-4 font-mono text-xs text-slate-700 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#0040F9] focus:border-[#0040F9] outline-none" placeholder="{\n  ..." />
                  {jsonError && <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center gap-2"><IconAlert /> {jsonError}</div>}
                </div>
                <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                  <button onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 text-slate-600 hover:bg-slate-200 rounded-lg font-medium transition-colors text-sm">Cancelar</button>
                  <button onClick={handleImportJson} className="px-5 py-2.5 bg-[#0040F9] text-white hover:bg-blue-700 rounded-lg font-medium shadow-md transition-colors text-sm">Importar Dados</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PainelClinico />);
  </script>
</body>
</html>
